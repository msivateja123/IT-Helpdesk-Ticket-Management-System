{% extends "base.html" %}{% block title %}Create account{% endblock %}
{% block content %}
<div class="auth-shell"><div class="auth-card">
  <div class="eyebrow">GET STARTED</div><h1>Create account</h1><p class="muted">New accounts are created as requesters.</p>
  <form method="post">
    <label class="form-label">Full name</label><input class="form-control mb-3" name="name" required maxlength="100">
    <label class="form-label">Email address</label><input class="form-control mb-3" type="email" name="email" required>
    <label class="form-label">Password</label><input class="form-control mb-4" type="password" name="password" minlength="8" required>
    <button class="btn btn-primary w-100">Create account</button>
  </form>
  <p class="text-center mt-4 mb-0 muted">Already registered? <a href="{{ url_for('login') }}">Sign in</a></p>
</div></div>
{% endblock %}
