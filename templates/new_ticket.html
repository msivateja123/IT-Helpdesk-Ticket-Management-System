{% extends "base.html" %}{% block title %}Create ticket{% endblock %}
{% block content %}
<div class="form-page"><div class="eyebrow">SUPPORT REQUEST</div><h1 class="page-title">Create a ticket</h1><p class="muted mb-4">Describe the issue clearly so the support team can investigate.</p>
<div class="panel">
<form method="post">
  <label class="form-label">Issue title</label><input class="form-control mb-3" name="title" maxlength="150" placeholder="Example: Laptop cannot connect to office Wi-Fi" required>
  <label class="form-label">Description</label><textarea class="form-control mb-3" name="description" rows="5" placeholder="What happened? When did it start? What have you tried?" required></textarea>
  <div class="row">
    <div class="col-md-6"><label class="form-label">Category</label><select class="form-select mb-3" name="category" required>{% for c in categories %}<option>{{ c }}</option>{% endfor %}</select></div>
    <div class="col-md-6"><label class="form-label">Priority</label><select class="form-select mb-3" name="priority" required>{% for p in priorities %}<option {% if p == 'Medium' %}selected{% endif %}>{{ p }}</option>{% endfor %}</select></div>
  </div>
  <div class="d-flex gap-2"><button class="btn btn-primary">Submit ticket</button><a class="btn btn-outline-secondary" href="{{ url_for('dashboard') }}">Cancel</a></div>
</form></div></div>
{% endblock %}
