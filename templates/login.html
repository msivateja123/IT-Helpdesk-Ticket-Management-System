{% extends "base.html" %}{% block title %}Sign in{% endblock %}
{% block content %}
<div class="auth-shell"><div class="auth-card">
  <div class="eyebrow">IT SUPPORT PORTAL</div><h1>Welcome back</h1><p class="muted">Sign in to manage your support requests.</p>
  <form method="post">
    <label class="form-label">Email address</label><input class="form-control mb-3" type="email" name="email" required autocomplete="email">
    <label class="form-label">Password</label><input class="form-control mb-4" type="password" name="password" required autocomplete="current-password">
    <button class="btn btn-primary w-100">Sign in</button>
  </form>
  <p class="text-center mt-4 mb-0 muted">New here? <a href="{{ url_for('register') }}">Create an account</a></p>
</div></div>
{% endblock %}
